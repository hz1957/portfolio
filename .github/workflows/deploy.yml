name: Pages Queue Guard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Pages publishes committed static root
        run: echo "GitHub Pages is configured to publish the committed root static files."
